###############################################################################
# PrepLink — Docker Compose: Celery Worker Fleet
# docker compose up                          → api + redis + both workers + beat
# docker compose up --scale worker-batch=3   → 3 batch workers
# docker compose --profile monitoring up     → also starts Flower on :5555
###############################################################################

x-common-env: &common-env
  REDIS_URL: redis://redis:6379
  ENVIRONMENT: ${ENVIRONMENT:-development}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  INSTACART_API_KEY: ${INSTACART_API_KEY}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  APP_SECRET_KEY: ${APP_SECRET_KEY}

x-worker-base: &worker-base
  build:
    context: ./backend
    dockerfile: worker/Dockerfile
  entrypoint: ["sh", "/app/worker/entrypoint.sh"]
  env_file: [./backend/.env]
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - ./backend:/app

services:

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app
        --host 0.0.0.0 --port 8000
        --workers 2
        --loop uvloop
        --ws websockets
        --log-level info
    ports: ["8000:8000"]
    environment:
      <<: *common-env
    env_file: [./backend/.env]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes: [./backend:/app]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-interactive:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: interactive
      CELERY_INTERACTIVE_CONCURRENCY: 4

  worker-batch:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: batch
      CELERY_BATCH_CONCURRENCY: 8

  beat:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: beat
    deploy:
      replicas: 1     # Must be exactly 1 — multiple beats double-fire tasks

  flower:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: flower
      FLOWER_USER: ${FLOWER_USER:-admin}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:-preplink_dev}
    ports: ["5555:5555"]
    profiles: [monitoring]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    env_file: [./frontend/.env.local]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
