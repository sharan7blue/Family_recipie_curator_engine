<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrepLink — Local Preview</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #1f1e1c;
    --muted: #6b6862;
    --accent: #d97a3d;
    --accent-ink: #ffffff;
    --ok: #3d8b5f;
    --err: #c0432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin-top: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--err); }

  form.card, .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], select {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text);
  }
  .checks { display: flex; flex-wrap: wrap; gap: 10px 16px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 13px; margin: 0; }
  button {
    margin-top: 18px; width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  #status { font-size: 13px; color: var(--muted); margin: 4px 0 0; min-height: 18px; }
  #status.err { color: var(--err); }

  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; }
  ul, ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
  .cart-link {
    display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 600;
    color: var(--accent); text-decoration: none;
  }
  .stub-note {
    font-size: 11px; color: var(--muted); border-top: 1px dashed var(--border);
    margin-top: 14px; padding-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PrepLink</h1>
    <div class="sub">Social recipe URL → age-adapted, pantry-aware Instacart cart</div>
    <div class="badge"><span class="dot" id="health-dot"></span><span id="health-text">checking API…</span></div>
  </header>

  <form class="card" id="recipe-form">
    <label for="url">Recipe URL</label>
    <input type="text" id="url" name="url" placeholder="https://tiktok.com/@chef/video/123" required />

    <label for="age_group">Age group</label>
    <select id="age_group" name="age_group">
      <option value="infant">Infant</option>
      <option value="toddler">Toddler</option>
      <option value="child">Child</option>
      <option value="teen">Teen</option>
      <option value="adult" selected>Adult</option>
    </select>

    <label>Dietary filters</label>
    <div class="checks">
      <label><input type="checkbox" name="dietary_filters" value="vegetarian" /> Vegetarian</label>
      <label><input type="checkbox" name="dietary_filters" value="vegan" /> Vegan</label>
      <label><input type="checkbox" name="dietary_filters" value="gluten_free" /> Gluten-free</label>
      <label><input type="checkbox" name="dietary_filters" value="dairy_free" /> Dairy-free</label>
      <label><input type="checkbox" name="dietary_filters" value="nut_free" /> Nut-free</label>
    </div>

    <button type="submit" id="submit-btn">Process recipe</button>
    <div id="status"></div>
  </form>

  <div id="result"></div>
</div>

<script>
  const form = document.getElementById('recipe-form');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const submitBtn = document.getElementById('submit-btn');
  const healthDot = document.getElementById('health-dot');
  const healthText = document.getElementById('health-text');

  async function checkHealth() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      healthDot.className = 'dot ' + (d.status === 'ok' ? 'ok' : 'down');
      healthText.textContent = `API ${d.status} · redis ${d.redis_cache} · celery ${d.celery_broker}`;
    } catch {
      healthDot.className = 'dot down';
      healthText.textContent = 'API unreachable';
    }
  }
  checkHealth();
  setInterval(checkHealth, 8000);

  let pollTimer = null;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearInterval(pollTimer);
    resultEl.innerHTML = '';
    statusEl.className = '';
    submitBtn.disabled = true;

    const dietary_filters = [...form.querySelectorAll('input[name="dietary_filters"]:checked')].map(el => el.value);
    const body = { url: form.url.value, age_group: form.age_group.value, dietary_filters };

    statusEl.textContent = 'Submitting…';
    try {
      const resp = await fetch('/api/recipe/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${resp.status}`);
      }
      const data = await resp.json();
      if (data.status === 'complete') {
        finish(data);
      } else {
        statusEl.textContent = `Dispatched via ${data.dispatch} — processing…`;
        poll(data.job_id);
      }
    } catch (err) {
      fail(err.message);
    }
  });

  function poll(jobId) {
    pollTimer = setInterval(async () => {
      try {
        const resp = await fetch(`/api/recipe/process/${jobId}`);
        if (resp.status === 404) return; // job_store write hasn't landed yet
        const data = await resp.json();
        if (data.status === 'complete') {
          clearInterval(pollTimer);
          finish(data);
        } else if (data.status === 'error') {
          clearInterval(pollTimer);
          fail(data.error || 'unknown error');
        }
      } catch (err) {
        clearInterval(pollTimer);
        fail(err.message);
      }
    }, 500);
  }

  function fail(message) {
    statusEl.textContent = 'Error: ' + message;
    statusEl.className = 'err';
    submitBtn.disabled = false;
  }

  function finish(data) {
    statusEl.textContent = 'Done';
    submitBtn.disabled = false;
    const r = data.recipe, c = data.cart;
    const tags = [r.age_group, ...(r.dietary_filters || [])].join(' · ');
    resultEl.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(r.metadata.title)}</h2>
        <div class="meta">${r.metadata.servings} servings · ${escapeHtml(tags)}</div>
        <h3>Ingredients</h3>
        <ul>${r.ingredients.map(i => `<li>${i.quantity} ${escapeHtml(i.unit)} ${escapeHtml(i.name)}</li>`).join('')}</ul>
        <h3>Steps</h3>
        <ol>${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Cart</h3>
        <ul>${c.items.map(i => `<li>${i.quantity} ${escapeHtml(i.unit)} ${escapeHtml(i.name)}</li>`).join('')}</ul>
        <a class="cart-link" href="${c.instacart_url}" target="_blank" rel="noopener">Open in Instacart →</a>
        <div class="stub-note">Local preview: extraction, adaptation, and cart-building are stubbed with fake data — no real LLM or Instacart calls are made.</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
